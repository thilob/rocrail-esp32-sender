; Gemeinsame Konfiguration für alle ESP32-Boards
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=0

; 1. ESP32 Generic Development Board (Original, am weitesten verbreitet)
; Sichere GPIOs: 4,5,12-19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(Boot),3(RX),6-11(Flash),15(Boot),34-39(input-only)
[env:esp32dev]
board = esp32dev
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"16,17,18,19\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"

; 2. ESP32-S3 DevKitC-1 (Neuere Generation mit USB-OTG)
; Sichere GPIOs: 1-14,15-21,35-45 (USB: 19,20 vermeiden wenn USB-OTG genutzt)
; Vermeiden: 0(Boot),26-32(Flash/PSRAM),46(Log),47-48(Flash)
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"1,2,3,4\"
  -D DEFAULT_OUTPUT_PINS=\"5,6,7,8\"

; 3. ESP32-C3 DevKitM-1 (RISC-V basiert, kompakt)
; Sichere GPIOs: 0-1,2-7,10 (weniger Pins verfügbar)
; Vermeiden: 8(Boot),9(Boot),18(USB-),19(USB+),20(RX),21(TX)
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"2,3,4,5\"
  -D DEFAULT_OUTPUT_PINS=\"6,7,10,0\"

; 4. NodeMCU-32S (Beliebtes Board mit integriertem USB-Chip)
; Sichere GPIOs: 4,5,12-19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(LED),3(RX),6-11(Flash),15(Boot),34-39(input-only)
[env:nodemcu-32s]
board = nodemcu-32s
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"16,17,18,19\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"

; 5. DOIT ESP32 DevKit v1 (Weit verbreitet, günstiges Entwicklerboard)
; Sichere GPIOs: 4,5,12-19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(LED),3(RX),6-11(Flash),15(Boot),34-39(input-only)
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"16,17,18,19\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"

; 6. Wemos Lolin32 (Klein, mit LiPo-Lader)
; Sichere GPIOs: 4,5,12-19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(Boot),3(RX),5(LED),6-11(Flash),15(Boot),34-39(input-only)
[env:lolin32]
board = lolin32
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"16,17,18,19\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"

; 7. SparkFun ESP32 Thing (Kompaktes Board mit LiPo-Support)
; Sichere GPIOs: 4,12-15,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(Boot),3(RX),5(LED),6-11(Flash),13(LED),34-39(input-only)
[env:esp32thing]
board = esp32thing
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"12,14,15,27\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,32,33\"

; 8. Adafruit ESP32 Feather (Feather-Format, kompatibel mit FeatherWings)
; Sichere GPIOs: 4,12-15,21,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(Boot),3(RX),5(LED),6-11(Flash),13(LED),34-39(input-only)
[env:featheresp32]
board = featheresp32
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"12,14,15,27\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,32,33\"

; 9. ESP-WROVER-KIT (Offizielles Espressif Board mit PSRAM)
; Sichere GPIOs: 4,5,12-15,18,19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(Boot/LED),3(RX),6-11(Flash),16-17(PSRAM),34-39(input-only)
[env:esp-wrover-kit]
board = esp-wrover-kit
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"12,13,14,15\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"

; 10. AZ-Delivery DevKit v4 (Beliebtes deutsches Entwicklerboard)
; Sichere GPIOs: 4,5,12-19,21-23,25-27,32,33
; Vermeiden: 0(Boot),1(TX),2(LED),3(RX),6-11(Flash),15(Boot),34-39(input-only)
[env:az-delivery-devkit-v4]
board = az-delivery-devkit-v4
build_flags =
  ${env.build_flags}
  -D DEFAULT_INPUT_PINS=\"16,17,18,19\"
  -D DEFAULT_OUTPUT_PINS=\"25,26,27,33\"


